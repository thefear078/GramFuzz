name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o gramfuzz ./cmd/gramfuzz

      - name: Test
        run: go test -short ./...

      - name: Demo scan
        run: ./gramfuzz scan --no-banner

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: gramfuzz-linux-amd64
          path: gramfuzz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o gramfuzz.exe ./cmd/gramfuzz

      - name: Test
        run: go test -short ./...

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: gramfuzz-windows-amd64
          path: gramfuzz.exe
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  python-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint user-simulator
        run: python -m py_compile modules/user-simulator/simulator.py

      - name: Lint ai-analyzer
        run: python -m py_compile modules/ai-analyzer/analyzer.py

      - name: Dry-run user-simulator
        run: python modules/user-simulator/simulator.py --bot demo --json

      - name: Dry-run attack-runner
        run: python modules/attack-runner/runner.py --bot demo --json
